<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arctic Sea Ice Decline — 1979 to 2024</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
<style>
:root {
  --bg:    #F5F5F7;
  --card:  #FFFFFF;
  --text:  #1D1D1F;
  --text2: #6E6E73;
  --border: rgba(0,0,0,.08);
  --border2: rgba(0,0,0,.13);
  --hover: #F0F0F2;
  --r: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg:    #000;
  --card:  #1C1C1E;
  --text:  #FFF;
  --text2: #8E8E93;
  --border: rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --hover: #2C2C2E;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

header {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 16px 28px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -.018em; }
header p  { font-size: .71rem; color: var(--text2); margin-top: 3px; }
.hd-acts  { display: flex; gap: 8px; align-items: center; flex-shrink: 0; margin-top: 2px; }

.btn {
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 5px 14px;
  cursor: pointer; font-size: .76rem; color: var(--text);
  font-weight: 500; transition: all .12s; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.on    { background: #0071E3; color:#fff; border-color:#0071E3; }
[data-theme="dark"] .btn.on { background:#0A84FF; border-color:#0A84FF; }

main {
  flex: 1; padding: 20px 28px;
  display: flex; flex-direction: column;
}
.chart-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px;
  box-shadow: var(--shadow); flex: 1;
}
#chart { height: clamp(360px, 58vh, 620px); }

.controls {
  display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap;
}
.year-display {
  font-size: 1.45rem; font-weight: 700; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; color: var(--text);
  min-width: 52px;
}
.ext-display {
  font-size: .8rem; color: var(--text2); margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.spacer { flex: 1; }
.progress-wrap {
  flex: 1; min-width: 120px; height: 3px; background: var(--border2);
  border-radius: 2px; position: relative; cursor: pointer;
}
.progress-fill {
  height: 100%; border-radius: 2px;
  background: #0071E3; width: 0%;
  transition: width .12s linear;
  pointer-events: none;
}
[data-theme="dark"] .progress-fill { background: #0A84FF; }

footer {
  padding: 12px 28px; border-top: 1px solid var(--border);
}
footer p { font-size: .63rem; color: var(--text2); line-height: 1.7; }

::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Arctic Sea Ice Decline</h1>
    <p>September minimum extent &middot; Northern Hemisphere &middot; 1979 – 2024</p>
  </div>
  <div class="hd-acts">
    <button class="btn" id="theme-btn" onclick="toggleTheme()">Dark</button>
  </div>
</header>

<main>
  <div class="chart-card">
    <div id="chart"></div>
    <div class="controls">
      <button class="btn" id="play-btn" onclick="togglePlay()">Play</button>
      <button class="btn" onclick="resetChart()">Reset</button>
      <div>
        <div class="year-display" id="yr">—</div>
        <div class="ext-display" id="ext"></div>
      </div>
      <div class="progress-wrap" id="progress-wrap" onclick="seekTo(event)">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>Source: National Snow and Ice Data Center (NSIDC), Sea Ice Index v3.0 &middot; NASA Earth Science Division</p>
</footer>

<script>
'use strict';

const YEARS = Array.from({length:46},(_,i)=>1979+i);
const SEP = [
  7.05,7.67,7.06,7.36,7.33,6.84,6.98,7.53,7.54,7.43,
  7.17,6.15,6.57,7.51,6.34,7.03,6.11,7.84,6.70,6.63,
  6.20,6.31,6.74,5.95,6.13,6.04,5.57,5.91,4.17,4.67,
  5.13,4.93,4.34,3.41,5.10,5.03,4.41,4.14,4.64,4.59,
  4.15,3.74,4.72,4.67,4.23,4.28
];

// Color by value: blue (high ice) → red (low ice)
const STOPS = [
  {t:0,    r:146, g:39,  b:30 },   // deep red
  {t:0.30, r:215, g:110, b:60 },   // orange
  {t:0.58, r:170, g:180, b:190},   // neutral grey
  {t:1,    r:26,  g:82,  b:118}    // deep blue
];
const V_MIN = 3.41, V_MAX = 7.84;

function valColor(v) {
  const t = Math.max(0, Math.min(1, (v - V_MIN) / (V_MAX - V_MIN)));
  let lo = STOPS[0], hi = STOPS[1];
  for(let i=0;i<STOPS.length-1;i++){
    if(t>=STOPS[i].t && t<=STOPS[i+1].t){ lo=STOPS[i]; hi=STOPS[i+1]; break; }
  }
  const s = (t - lo.t) / (hi.t - lo.t);
  const r = Math.round(lo.r + (hi.r-lo.r)*s);
  const g = Math.round(lo.g + (hi.g-lo.g)*s);
  const b = Math.round(lo.b + (hi.b-lo.b)*s);
  return `rgb(${r},${g},${b})`;
}

const S = { theme:'light', idx:0, playing:false, timer:null };

function plotLayout(dk) {
  const gc = dk ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
  const tc = dk ? '#8E8E93' : '#6E6E73';
  const bg = dk ? '#1C1C1E' : '#FFFFFF';
  return {
    paper_bgcolor: bg, plot_bgcolor: bg,
    font: {family:'-apple-system,"SF Pro Text",sans-serif', color: dk?'#FFF':'#1D1D1F', size:11},
    margin: {t:16, r:16, b:48, l:56},
    hovermode: 'x unified',
    hoverlabel: {
      bgcolor: dk?'#2C2C2E':'#FFF',
      bordercolor: dk?'rgba(255,255,255,.15)':'rgba(0,0,0,.1)',
      font: {size:11.5}
    },
    xaxis: {
      range: [1978.4, 2024.6],
      gridcolor: gc, linecolor:'transparent', tickcolor:'transparent',
      tickfont: {color:tc}, title:{text:'Year', font:{size:10,color:tc}}
    },
    yaxis: {
      range: [2.6, 8.4],
      gridcolor: gc, linecolor:'transparent', tickcolor:'transparent',
      zeroline: false, tickfont: {color:tc},
      title: {text:'Extent (million km²)', font:{size:10,color:tc}}
    },
    showlegend: false,
    bargap: 0.18
  };
}

function draw() {
  const dk = S.theme === 'dark';
  const n  = S.idx;

  const xs = YEARS.slice(0, n);
  const ys = SEP.slice(0, n);
  const colors = ys.map(valColor);

  // highlight the last bar
  const lineWidths = ys.map((_,i) => i===n-1 ? 1.8 : 0);
  const lineColors = ys.map((_,i) => i===n-1 ? (dk?'#FFF':'#1D1D1F') : 'transparent');

  const trace = {
    x: xs, y: ys, type: 'bar',
    marker: {
      color: colors,
      line: { color: lineColors, width: lineWidths }
    },
    hovertemplate: '<b>%{x}</b>: %{y:.2f} M km²<extra></extra>'
  };

  Plotly.react('chart', [trace], plotLayout(dk), {
    responsive: true, displaylogo: false,
    displayModeBar: true,
    modeBarButtonsToRemove: ['lasso2d','select2d','autoScale2d'],
    toImageButtonOptions: {format:'png',width:1600,height:900,scale:2,filename:'arctic-sea-ice'}
  });

  // sidebar info
  if(n > 0) {
    const yr = YEARS[n-1], v = SEP[n-1];
    document.getElementById('yr').textContent  = yr;
    document.getElementById('ext').textContent = v.toFixed(2) + ' M km²';
    document.getElementById('progress-fill').style.width = ((n-1)/(YEARS.length-1)*100)+'%';
  } else {
    document.getElementById('yr').textContent  = '—';
    document.getElementById('ext').textContent = '';
    document.getElementById('progress-fill').style.width = '0%';
  }
}

function togglePlay() {
  S.playing ? stopPlay() : startPlay();
}
function startPlay() {
  if(S.idx >= YEARS.length) S.idx = 0;
  S.playing = true;
  document.getElementById('play-btn').textContent = 'Pause';
  document.getElementById('play-btn').classList.add('on');
  S.timer = setInterval(() => {
    S.idx++;
    draw();
    if(S.idx >= YEARS.length) stopPlay();
  }, 130);
}
function stopPlay() {
  S.playing = false;
  clearInterval(S.timer);
  document.getElementById('play-btn').textContent = 'Play';
  document.getElementById('play-btn').classList.remove('on');
}
function resetChart() {
  stopPlay();
  S.idx = 0;
  draw();
}

function seekTo(e) {
  stopPlay();
  const rect = document.getElementById('progress-wrap').getBoundingClientRect();
  const t = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  S.idx = Math.round(t * (YEARS.length - 1)) + 1;
  draw();
}

function toggleTheme() {
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('theme-btn').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
  draw();
}

document.addEventListener('keydown', e => {
  if(e.key === ' ')           { e.preventDefault(); togglePlay(); }
  if(e.key === 'ArrowRight')  { stopPlay(); S.idx = Math.min(YEARS.length, S.idx+1); draw(); }
  if(e.key === 'ArrowLeft')   { stopPlay(); S.idx = Math.max(0, S.idx-1);             draw(); }
});

document.addEventListener('DOMContentLoaded', () => {
  S.idx = YEARS.length; // show all on load
  draw();
});
</script>
</body>
</html>
